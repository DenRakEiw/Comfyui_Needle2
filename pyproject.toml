[project]
# Immutable once published: this is the node's permanent registry id.
name = "comfyui-needle2"
description = "Cactus Needle 2 in ComfyUI: a 45M-parameter CPU model that turns text into typed graph parameters, plus nodes that read a ComfyUI workflow back out of a PNG."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cactus-needle>=2.0.11"]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/DenRakEiw/Comfyui_Needle2"
Documentation = "https://github.com/DenRakEiw/Comfyui_Needle2#readme"
"Bug Tracker" = "https://github.com/DenRakEiw/Comfyui_Needle2/issues"

[tool.comfy]
PublisherId = "denrakeiw"
DisplayName = "ComfyUI Needle 2"
